syntax = "proto3";

package stars.v1;

option csharp_namespace = "Stars.Api.Grpc";

// Read API for programmatic clients. Write/review operations are exposed over HTTP.
service StarsRegistry {
  rpc ResolveBySourceId (ResolveBySourceIdRequest) returns (ResolveBySourceIdResponse);
  rpc GetMasterEntity (GetMasterEntityRequest) returns (GetMasterEntityResponse);
  rpc ListMatchesForReview (ListMatchesForReviewRequest) returns (ListMatchesForReviewResponse);
}

message ResolveBySourceIdRequest {
  string source_feed_id = 1;
  string entity_kind = 2;
  string source_key = 3;
}

message ResolveBySourceIdResponse {
  bool found = 1;
  string source_entity_id = 2;
  string master_entity_id = 3;
  string master_name = 4;
  string display_name = 5;
  double confidence = 6;
  string linked_at = 7;
}

message GetMasterEntityRequest {
  string master_entity_id = 1;
}

message SourceLink {
  string source_entity_id = 1;
  string source_feed_id = 2;
  string feed_key = 3;
  string provider_name = 4;
  string display_name = 5;
  string external_id = 6;
  repeated string names = 7;
}

message GetMasterEntityResponse {
  bool found = 1;
  string master_entity_id = 2;
  string entity_kind = 3;
  string preferred_name = 4;
  string normalized_name = 5;
  string sport_code = 6;
  string country_code = 7;
  repeated string names = 8;
  repeated SourceLink sources = 9;
}

message ListMatchesForReviewRequest {
  int32 limit = 1;
}

message ReviewItem {
  string candidate_id = 1;
  string source_entity_id = 2;
  string source_name = 3;
  string source_feed_key = 4;
  string target_name = 5;
  double score = 6;
  string reason = 7;
  string generated_at = 8;
}

message ListMatchesForReviewResponse {
  repeated ReviewItem items = 1;
}
