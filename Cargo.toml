[package]
name = "stars"
version = "0.1.0"
edition = "2024"

[dependencies]
any_ascii = "0.3.3"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
rapidfuzz = "0.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "macros", "migrate", "chrono", "json"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
